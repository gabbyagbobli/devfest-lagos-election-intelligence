    let currentStep = 0;

    function renderCodelab() {
      const drawer = document.getElementById("drawer");
      drawer.innerHTML = STEPS.map((s, idx) => `
        <div class="step-nav-item ${idx === currentStep ? 'active' : ''} ${idx < currentStep ? 'completed' : ''}" onclick="goToStep(${idx})">
          <div class="step-circle">${idx < currentStep ? '✓' : idx + 1}</div>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.title}</span>
          <span class="step-duration-tag">${s.duration}m</span>
        </div>
      `).join("");

      const step = STEPS[currentStep];
      document.getElementById("step-title").textContent = `${currentStep + 1}. ${step.title}`;
      document.getElementById("step-duration").textContent = `Duration: ${step.duration}:00`;
      document.getElementById("step-content").innerHTML = step.html;

      const minsLeft = STEPS.slice(currentStep).reduce((acc, s) => acc + s.duration, 0);
      document.getElementById("time-remaining").textContent = `⏱️ ${minsLeft} mins left`;

      document.getElementById("prev-btn").disabled = currentStep === 0;
      const nextBtn = document.getElementById("next-btn");
      if (currentStep === STEPS.length - 1) {
        nextBtn.textContent = "Launch Live App 🚀";
      } else {
        nextBtn.textContent = "Next Step →";
      }

      // Attach Copy buttons to code blocks
      document.querySelectorAll(".step-content pre").forEach((pre) => {
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, "").trim());
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 1500);
        };
        pre.appendChild(btn);
      });

      document.getElementById("main-scroll").scrollTop = 0;
      window.location.hash = `#${currentStep}`;
    }

    function goToStep(idx) {
      if (idx >= 0 && idx < STEPS.length) {
        currentStep = idx;
        renderCodelab();
      }
    }

    document.getElementById("prev-btn").addEventListener("click", () => goToStep(currentStep - 1));
    document.getElementById("next-btn").addEventListener("click", () => {
      if (currentStep === STEPS.length - 1) {
        window.location.href = "/";
      } else {
        goToStep(currentStep + 1);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && currentStep < STEPS.length - 1) goToStep(currentStep + 1);
      if (e.key === "ArrowLeft" && currentStep > 0) goToStep(currentStep - 1);
    });

    const hashIdx = parseInt(window.location.hash.replace("#", ""), 10);
    if (!isNaN(hashIdx) && hashIdx >= 0 && hashIdx < STEPS.length) {
      currentStep = hashIdx;
    }
    renderCodelab();
  </script>
