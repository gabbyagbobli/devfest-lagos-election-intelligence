<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevFest Lagos 2026 — 10-Minute Introduction Slides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --card: #111827;
      --border: #1e293b;
      --emerald: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, rgba(16,185,129,0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(59,130,246,0.12), transparent 45%),
                  var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .deck-topbar {
      height: 56px;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7, 11, 20, 0.85);
    }
    .deck-brand {
      font-weight: 700;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .deck-links {
      display: flex;
      gap: 0.6rem;
    }
    .deck-link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .deck-link:hover { border-color: var(--emerald); color: #fff; }

    .slide-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .slide-frame {
      width: 100%;
      max-width: 1120px;
      min-height: 540px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #293548;
      border-radius: 20px;
      padding: 3rem 3.5rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .slide-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--emerald);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }
    .slide-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    .slide-body {
      font-size: 1.12rem;
      line-height: 1.7;
      color: #cbd5e1;
    }
    .slide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.1rem;
      margin-top: 1.2rem;
    }
    .mini-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.15rem;
    }
    .mini-box h3 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 0.4rem;
    }
    .mini-box p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .slide-footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .ctrl-btn.primary {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #052e16;
    }
    .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    code {
      font-family: 'JetBrains Mono', monospace;
      color: #34d399;
      background: rgba(16,185,129,0.12);
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <header class="deck-topbar">
    <div class="deck-brand">🎤 DevFest Lagos 2026 • 10-Minute Opening Presentation</div>
    <div class="deck-links">
      <a href="/" class="deck-link">🛡️ Live Agent App</a>
      <a href="/codelab/" class="deck-link">📘 40-Min Codelab</a>
    </div>
  </header>

  <main class="slide-stage">
    <section class="slide-frame">
      <div>
        <div class="slide-kicker" id="s-kicker">SLIDE 1 OF 8 • INTRODUCTION (10 MINS)</div>
        <h1 class="slide-title" id="s-title">Loading...</h1>
        <div class="slide-body" id="s-body"></div>
      </div>
      <div class="slide-footer">
        <span id="s-note">Speaker Timing: ~1 min</span>
        <div class="controls">
          <button class="ctrl-btn" id="prev-slide">← Prev</button>
          <span id="slide-counter" style="font-family:'JetBrains Mono',monospace;">1 / 8</span>
          <button class="ctrl-btn primary" id="next-slide">Next →</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SLIDES = [
      {
        kicker: "SLIDE 1 OF 8 • DEVFEST LAGOS 2026 WORKSHOP",
        title: "The Problem: Election Misinformation & Information Trust",
        timing: "Speaker Timing: Minute 0:00 – 1:15",
        html: `
          <p>As elections approach, millions of citizens turn to the web and AI systems for answers about candidates, polling hours, PVC deadlines, and breaking announcements.</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>🚨 Viral Fabrication</h3>
              <p>Doctored postponement notices and fake SMS/NIN voting links circulate rapidly across messaging apps.</p>
            </div>
            <div class="mini-box">
              <h3>⏳ Outdated &amp; Contradictory Info</h3>
              <p>Old rules get mixed up with current statutory provisions (Section 47 BVAS &amp; PVC mandates).</p>
            </div>
            <div class="mini-box">
              <h3>🎯 Our Engineering Mission</h3>
              <p>Build an AI system that grounds every answer in verifiable evidence and communicates uncertainty transparently.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 2 OF 8 • WHY CHATBOTS FAIL",
        title: "Why Ordinary Chatbots Are Not Enough",
        timing: "Speaker Timing: Minute 1:15 – 2:30",
        html: `
          <p>An ordinary chatbot generates plausible tokens from static training memory—making it dangerous for civic and electoral intelligence.</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>❌ Zero Live Grounding</h3>
              <p>Cannot inspect today's official INEC communiqué or verify accredited observer logs.</p>
            </div>
            <div class="mini-box">
              <h3>❌ Hallucinated Citations</h3>
              <p>When pressed for sources, ungrounded LLMs frequently invent URLs, court rulings, or dates.</p>
            </div>
            <div class="mini-box">
              <h3>❌ Naive RAG Confuses Rumors</h3>
              <p>Finding a document that mentions a rumor is <strong>Retrieval</strong>, not <strong>Verification</strong>.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 3 OF 8 • AGENTIC PARADIGM",
        title: "What Makes an AI Agent Different?",
        timing: "Speaker Timing: Minute 2:30 – 3:45",
        html: `
          <p>An AI Agent pairs a reasoning model with explicit instructions, deterministic tools, and multi-agent coordination.</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>🛠️ Tool Calling</h3>
              <p>Invokes Python functions (<code>search_verified_election_corpus</code>, <code>verify_election_claim</code>) instead of guessing.</p>
            </div>
            <div class="mini-box">
              <h3>🏛️ Source Allowlisting</h3>
              <p>Evaluates domain authority against a 3-Tier Electoral Source Trust Registry before using any content.</p>
            </div>
            <div class="mini-box">
              <h3>⚖️ Epistemic Humility</h3>
              <p>Outputs <code>SUPPORTED</code>, <code>CONTRADICTED</code>, or <code>INSUFFICIENT_EVIDENCE</code> when proof is incomplete.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 4 OF 8 • THE TECH STACK",
        title: "Introducing Google ADK & The Antigravity Harness",
        timing: "Speaker Timing: Minute 3:45 – 5:00",
        html: `
          <p>We combine two developer technologies to build, test, and ship our multi-agent system in 40 minutes:</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>⚡ Google Agent Development Kit (ADK 2)</h3>
              <p>Code-first Python framework (<code>google-adk</code>) with <code>Agent</code>, <code>FunctionTool</code>, <code>sub_agents</code> delegation, <code>adk run</code> CLI, and <code>adk web</code> trace inspector.</p>
            </div>
            <div class="mini-box">
              <h3>🚀 The Antigravity Harness</h3>
              <p>Agentic coding environment that accelerates multi-file scaffolding, automated <code>pytest</code> verification, guardrail testing, and cloud deployment.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 5 OF 8 • SYSTEM ARCHITECTURE",
        title: "Our Multi-Agent Election Intelligence Architecture",
        timing: "Speaker Timing: Minute 5:00 – 6:30",
        html: `
          <p>Instead of a single overloaded prompt, we orchestrate four specialized ADK agents with clear boundaries:</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>A. Coordinator (<code>root_agent</code>)</h3>
              <p>Classifies user intent, routes to the right specialist, and enforces epistemic uncertainty banners.</p>
            </div>
            <div class="mini-box">
              <h3>B. Election Research Agent</h3>
              <p>Retrieves official voting procedures, statutory laws, and runs domain credibility checks.</p>
            </div>
            <div class="mini-box">
              <h3>C. Claim Verification Agent</h3>
              <p>Cross-checks viral claims against official evidence and assigns <code>SUPPORTED</code> / <code>CONTRADICTED</code> / <code>INSUFFICIENT_EVIDENCE</code>.</p>
            </div>
            <div class="mini-box">
              <h3>D. Election Info Analyst</h3>
              <p>Summarizes official INEC communiqués and compares Tier 1, Tier 2, and Tier 3 source perspectives.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 6 OF 8 • GROUNDING & EPISTEMICS",
        title: "Tool Calling, Grounding, Evidence & Verification",
        timing: "Speaker Timing: Minute 6:30 – 8:00",
        html: `
          <p><strong>Architectural Rule: Retrieval ≠ Verification.</strong> Every piece of evidence is weighed by its Trust Tier:</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>🥇 Tier 1: Official (0.98)</h3>
              <p>INEC Regulations, Official Press Releases, and the Electoral Act Gazette. Primary authority for rules &amp; dates.</p>
            </div>
            <div class="mini-box">
              <h3>🥈 Tier 2: Observers (0.90)</h3>
              <p>YIAGA Africa, DUBAWA Fact-Checkers, Civil Society Situation Room. Field observation &amp; forensic verification.</p>
            </div>
            <div class="mini-box">
              <h3>🥉 Tier 3: Media (0.78)</h3>
              <p>Channels TV &amp; Premium Times Electoral Desks. Corroborated against Tier 1/2 for statutory accuracy.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 7 OF 8 • 40-MINUTE ROADMAP",
        title: "What We Are Building in the Hands-on Workshop",
        timing: "Speaker Timing: Minute 8:00 – 9:00",
        html: `
          <p>In the next 40 minutes, you will follow our step-by-step Codelab to build and test the complete system:</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>Steps 1–3 (12 mins)</h3>
              <p>Architecture walkthrough, environment setup, and verifying the 9-document Electoral Corpus.</p>
            </div>
            <div class="mini-box">
              <h3>Steps 4–5 (11 mins)</h3>
              <p>Implement the 6 ADK Function Tools for retrieval, source allowlisting, and claim verification.</p>
            </div>
            <div class="mini-box">
              <h3>Steps 6–9 (17 mins)</h3>
              <p>Wire the 4 ADK agents, run <code>pytest</code>, launch the Trust Dashboard, and test 5 live election scenarios.</p>
            </div>
          </div>
        `
      },
      {
        kicker: "SLIDE 8 OF 8 • TIME TO CODE!",
        title: "Let's Build! Open the Codelab Now",
        timing: "Speaker Timing: Minute 9:00 – 10:00 (Transition to 40-Min Hands-On)",
        html: `
          <p>Everything is ready for you to build, run, and test your Election Intelligence Agent:</p>
          <div class="slide-grid">
            <div class="mini-box">
              <h3>📘 Interactive Codelab</h3>
              <p><a href="/codelab/" style="color:#34d399;font-weight:700;">Open the 40-Minute Hands-On Codelab →</a></p>
            </div>
            <div class="mini-box">
              <h3>🛡️ Live Deployed App</h3>
              <p><a href="/" style="color:#60a5fa;font-weight:700;">Open the Election Intelligence Dashboard →</a></p>
            </div>
            <div class="mini-box">
              <h3>💻 GitHub Starter Repo</h3>
              <p><a href="https://github.com/gabbyagbobli/devfest-lagos-election-intelligence" target="_blank" style="color:#f8fafc;font-weight:700;">gabbyagbobli/devfest-lagos-election-intelligence ↗</a></p>
            </div>
          </div>
        `
      }
    ];

    let idx = 0;
    function render() {
      const s = SLIDES[idx];
      document.getElementById("s-kicker").textContent = s.kicker;
      document.getElementById("s-title").textContent = s.title;
      document.getElementById("s-body").innerHTML = s.html;
      document.getElementById("s-note").textContent = s.timing;
      document.getElementById("slide-counter").textContent = `${idx + 1} / ${SLIDES.length}`;
      document.getElementById("prev-slide").disabled = idx === 0;
      document.getElementById("next-slide").textContent = idx === SLIDES.length - 1 ? "Start Codelab →" : "Next →";
    }
    document.getElementById("prev-slide").onclick = () => { if (idx > 0) { idx--; render(); } };
    document.getElementById("next-slide").onclick = () => {
      if (idx < SLIDES.length - 1) { idx++; render(); }
      else { window.location.href = "/codelab/"; }
    };
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && idx < SLIDES.length - 1) { idx++; render(); }
      if (e.key === "ArrowLeft" && idx > 0) { idx--; render(); }
    });
    render();
  </script>
</body>
</html>
